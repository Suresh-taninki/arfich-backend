name: Deploy App

on:
  push:
    branches:
      - dev
      - qa
      - prod

jobs:
  deploy:
    runs-on: [self-hosted, hloxpat, app]
    steps:
      - name: Set Environment
        run: |
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "DEPLOY_PATH=/opt/hloxpat/dev/api/app" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "qa" ]; then
            echo "DEPLOY_PATH=/opt/hloxpat/qa/api/app" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=/opt/hloxpat/prod/api/app" >> $GITHUB_ENV
          fi

      - name: Pull Code
        run: |
          cd $DEPLOY_PATH
          git fetch origin
          git checkout $GITHUB_REF_NAME
          git pull origin $GITHUB_REF_NAME

      - name: Deploy Container
        run: |
          cd $DEPLOY_PATH
          docker compose up -d --build
